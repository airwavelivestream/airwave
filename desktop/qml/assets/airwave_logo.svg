<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11131A" />
      <stop offset="100%" stop-color="#07080C" />
    </linearGradient>

    <!-- Neon Glow Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#19E3FF" />
      <stop offset="50%" stop-color="#7C5CFF" />
      <stop offset="100%" stop-color="#B6FF3B" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Base Tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" ry="96" fill="url(#bgGrad)" stroke="#19E3FF" stroke-opacity="0.35" stroke-width="6"/>

  <!-- Subtle Internal Grid Line -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#7C5CFF" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6,6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#19E3FF" stroke-opacity="0.15" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Concentric Dynamic Wave Glyphs (Signature Motif) -->
  <g filter="url(#glow)">
    <!-- Outer Wave Ring Arcs -->
    <path d="M 120 180 A 160 160 0 0 1 392 180" fill="none" stroke="url(#waveGrad)" stroke-width="24" stroke-linecap="round"/>
    <path d="M 392 332 A 160 160 0 0 1 120 332" fill="none" stroke="url(#waveGrad)" stroke-width="24" stroke-linecap="round" stroke-opacity="0.7"/>

    <!-- Middle Wave Ring Arcs -->
    <path d="M 160 215 A 110 110 0 0 1 352 215" fill="none" stroke="#19E3FF" stroke-width="20" stroke-linecap="round"/>
    <path d="M 352 297 A 110 110 0 0 1 160 297" fill="none" stroke="#19E3FF" stroke-width="20" stroke-linecap="round" stroke-opacity="0.85"/>

    <!-- Inner Core Wave Arc -->
    <path d="M 205 240 A 55 55 0 0 1 307 240" fill="none" stroke="#B6FF3B" stroke-width="16" stroke-linecap="round"/>
    <circle cx="256" cy="275" r="14" fill="#B6FF3B" />
  </g>
</svg>
