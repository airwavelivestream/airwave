name: Airwave Automated Release Builds

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Windows Desktop Build (Stable & Passing: 136MB complete bundle)
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC C++ Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.7
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia'
          aqtversion: '==3.1.*'
          extra: '--timeout 60'

      - name: Install FFmpeg Dev Headers & Libs
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl-shared.zip" -OutFile "ffmpeg.zip"
          Expand-Archive ffmpeg.zip -DestinationPath "ffmpeg-dist"
          $ffmpegRoot = (Get-ChildItem -Path "ffmpeg-dist" -Directory | Select-Object -First 1).FullName
          echo "FFMPEG_ROOT=$ffmpegRoot" >> $env:GITHUB_ENV
          echo "AVCODEC_INCLUDE_DIR=$ffmpegRoot/include" >> $env:GITHUB_ENV
          echo "AVCODEC_LIBRARY=$ffmpegRoot/lib/avcodec.lib" >> $env:GITHUB_ENV
          echo "AVUTIL_LIBRARY=$ffmpegRoot/lib/avutil.lib" >> $env:GITHUB_ENV
          echo "SWSCALE_LIBRARY=$ffmpegRoot/lib/swscale.lib" >> $env:GITHUB_ENV
          echo "$ffmpegRoot/bin" >> $env:GITHUB_PATH

      - name: Configure CMake & Build
        shell: pwsh
        run: |
          if (Test-Path "build") { Remove-Item -Recurse -Force "build" }
          cmake -B build -S desktop -DCMAKE_BUILD_TYPE=Release `
            -DAVCODEC_INCLUDE_DIR="$env:AVCODEC_INCLUDE_DIR" `
            -DAVCODEC_LIBRARY="$env:AVCODEC_LIBRARY" `
            -DAVUTIL_LIBRARY="$env:AVUTIL_LIBRARY" `
            -DSWSCALE_LIBRARY="$env:SWSCALE_LIBRARY"
          cmake --build build --config Release

      - name: Stage Windows Distribution Files
        shell: pwsh
        run: |
          windeployqt --qmldir desktop/qml build/Release/Airwave.exe
          Copy-Item "$env:FFMPEG_ROOT/bin/*.dll" "build/Release/" -Force
          # Copy QML directory alongside binary so engine can always locate main.qml and components
          New-Item -ItemType Directory -Path "build/Release/qml" -Force
          Copy-Item -Path "desktop/qml/*" -Destination "build/Release/qml/" -Recurse -Force
          New-Item -ItemType Directory -Path "dist/Airwave-Windows-x64" -Force
          Copy-Item -Path "build/Release/*" -Destination "dist/Airwave-Windows-x64" -Recurse -Force

      - name: Build Single Standalone Installer (.exe)
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer.iss
          options: /DMyAppVersion=1.0.0

      - name: Upload Windows Standalone Executable
        uses: actions/upload-artifact@v4
        with:
          name: Airwave-Windows-Installer
          path: dist/*.exe

  # 2. Android APK Build (Uses Ubuntu native Android SDK without deprecated third-party action)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Android APK
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # Use pre-installed Android SDK on GitHub Ubuntu runners
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses || true
          
          # Install Gradle and assemble APK
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          ./gradle-8.7/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: airwave-android
          path: android/app/build/outputs/apk/**/*.apk

  # 3. Automatic GitHub Release Deployment
  create-release:
    needs: [build-windows, build-android]
    if: always() && (needs.build-windows.result == 'success') && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Airwave-Windows-Installer
          path: release-files/

      - name: Download Android Artifact (Optional)
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: airwave-android
          path: release-files/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          name: "Airwave ${{ github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          body: |
            ## ⚡ Airwave Official Release
            **Your phone. Your big screen. Zero lag.**

            ### 📦 Downloads:
            - **Windows PC**: `Airwave-v1.0.0-Setup.exe` (Single Standalone Executable / Installer)
            - **Android Phone**: `app-debug.apk`
