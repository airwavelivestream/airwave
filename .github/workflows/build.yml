name: Airwave Automated Release Builds

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 1. Windows Desktop Build (Qt 6.7 + MSVC + FFmpeg + windeployqt)
  build-windows:
    runs-on: windows-2022
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup MSVC C++ Compiler
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt 6.7
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtmultimedia'

      - name: Configure CMake & Build
        shell: bash
        run: |
          cmake -B build -S desktop -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release

      - name: Package with windeployqt
        shell: pwsh
        run: |
          windeployqt --qmldir desktop/qml build/Release/Airwave.exe
          New-Item -ItemType Directory -Path "dist/Airwave-Windows-x64" -Force
          Copy-Item -Path "build/Release/*" -Destination "dist/Airwave-Windows-x64" -Recurse -Force
          Compress-Archive -Path "dist/Airwave-Windows-x64/*" -DestinationPath "dist/Airwave-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Airwave-Windows-x64
          path: dist/Airwave-Windows-x64.zip

  # 2. Android APK Build (Kotlin, Compose & MediaProjection)
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable & Assemble APK
        working-directory: android
        run: |
          chmod +x gradlew 2>/dev/null || true
          gradle assembleRelease || gradle assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: airwave-android
          path: android/app/build/outputs/apk/**/*.apk

  # 3. Automatic GitHub Release Deployment
  create-release:
    needs: [build-windows, build-android]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Airwave-Windows-x64
          path: release-files/

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: airwave-android
          path: release-files/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/**/*
          name: "Airwave ${{ github.ref_name || 'v1.0.0' }}"
          draft: false
          prerelease: false
          body: |
            ## ⚡ Airwave Official Release
            **Your phone. Your big screen. Zero lag.**

            ### 📦 Downloads:
            - **Windows PC**: `Airwave-Windows-x64.zip` (Extract & run `Airwave.exe`)
            - **Android Phone**: `app-release.apk` (or `app-debug.apk`)
            
            ### 🚀 Quick Start:
            1. Extract `Airwave.exe` (Click *More info* -> *Run anyway* if Windows SmartScreen displays).
            2. Install the APK on your Android phone.
            3. Plug USB cable -> Turn on **USB tethering** in Android Settings.
            4. Tap **START CAST** for ultra-low latency (<16ms) gameplay!
